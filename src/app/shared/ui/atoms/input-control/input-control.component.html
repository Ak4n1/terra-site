<input
  #inputRef
  class="ui-input-control"
  [class.ui-input-control--editorial]="variant === 'editorial'"
  [class.ui-input-control--editorial-plain]="variant === 'editorial-plain' || variant === '2'"
  [type]="type"
  [value]="value"
  [disabled]="disabled"
  [placeholder]="placeholder"
  [attr.autocomplete]="autocomplete || null"
  [attr.maxlength]="maxLength"
  [attr.inputmode]="inputMode || null"
  [attr.pattern]="pattern || null"
  [attr.aria-label]="ariaLabel || null"
  (input)="onInput($event)">
