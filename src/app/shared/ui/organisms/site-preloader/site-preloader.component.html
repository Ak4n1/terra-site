<div class="nk-preloader" #preloader>
  <div
    #preloaderBG
    class="nk-preloader-bg"
    data-close-frames="23"
    data-close-speed="1.1"
    data-close-sprites="assets/images/app/preloader/preloader.png"
    data-open-frames="23"
    data-open-speed="1.1"
    data-open-sprites="assets/images/app/preloader/preloader.png">
  </div>

  <div class="nk-preloader-content" #content>
    <div>
      <div class="nk-preloader-animation" #preloadAnim></div>
    </div>
  </div>

  <div class="nk-preloader-skip" #skipBtn>Skip</div>
</div>
